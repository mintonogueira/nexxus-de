name: Bootstrap Etapa 13

on:
  push:
    branches: [etapa-13-desktop-shell-impl]
    paths:
      - '.github/workflows/bootstrap-etapa13.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: etapa-13-desktop-shell-impl
      - name: Materializar implementação da Etapa 13
        shell: sh
        run: |
          {
            cat .stage13-bootstrap/chunk00 .stage13-bootstrap/chunk01 .stage13-bootstrap/chunk02 .stage13-bootstrap/chunk03 .stage13-bootstrap/chunk04
            cat <<'NEXXUS_ETAPA13_LAST'
          
          NEXXUS_ETAPA13_LAST
          } | tr -d '[:space:]' | base64 -d | tar -xz
          rm -rf .stage13-bootstrap
          rm -f .github/workflows/bootstrap-etapa13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(etapa-13): implementa Desktop Shell inicial'
          git push origin HEAD:etapa-13-desktop-shell-impl
