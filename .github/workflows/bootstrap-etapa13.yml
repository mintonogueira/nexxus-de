name: Bootstrap Etapa 13

on:
  push:
    branches: [etapa-13-desktop-shell-impl]
    paths:
      - '.github/workflows/bootstrap-etapa13.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: etapa-13-desktop-shell-impl
      - name: Materializar implementação da Etapa 13
        shell: sh
        run: |
          cat <<'NEXXUS_ETAPA13_ARCHIVE' | base64 -d | tar -xz
          
          NEXXUS_ETAPA13_ARCHIVE
          rm -f .github/workflows/bootstrap-etapa13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/etapa-13-desktop-shell.yml etapas/etapa-13-desktop-shell .github/workflows/bootstrap-etapa13.yml
          git commit -m 'feat(etapa-13): implementa Desktop Shell inicial'
          git push origin HEAD:etapa-13-desktop-shell-impl
