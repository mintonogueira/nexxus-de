# CI real da Etapa 04 com Xvfb nos cenários Arch Linux e Debian.
name: Etapa 04 - Backend X11

on:
  push:
    branches: [main, etapa-04-backend-x11, etapa-04-backend-x11-impl]
    paths:
      - 'etapas/etapa-04-backend-x11/**'
      - 'etapas/etapa-03-session-runtime/crates/nexxus-session/**'
      - 'etapas/etapa-02-window-manager-core/crates/nexxus-wm/**'
      - 'etapas/etapa-01-core-fundacao/crates/nexxus-core/**'
      - 'etapas/etapa-01-core-fundacao/crates/nexxus-backend-api/**'
      - '.github/workflows/etapa-04-backend-x11.yml'
  workflow_dispatch:

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates passwd
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/apt-get' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Debian como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-04-backend-x11"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-04-backend-x11' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-debian.sh" > /tmp/nexxus-debian.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-debian.log
          if [ "$status" -ne 0 ]; then tail -n 120 /tmp/nexxus-debian.log; exit "$status"; fi
      - name: Exportar pacote Debian
        uses: actions/upload-artifact@v4
        with:
          name: etapa-04-debian
          path: |
            etapas/etapa-04-backend-x11/Cargo.lock
            etapas/etapa-04-backend-x11/dist/debian/*.deb
          if-no-files-found: error

  archlinux-current:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm sudo git ca-certificates shadow
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Arch como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-04-backend-x11"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-04-backend-x11' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-arch.sh" > /tmp/nexxus-arch.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-arch.log
          if [ "$status" -ne 0 ]; then tail -n 120 /tmp/nexxus-arch.log; exit "$status"; fi
      - name: Exportar pacote Arch
        uses: actions/upload-artifact@v4
        with:
          name: etapa-04-arch
          path: etapas/etapa-04-backend-x11/dist/arch/*.pkg.tar.*
          if-no-files-found: error
