# CI real da Etapa 01 nos dois cenários definidos pelo contrato de build.
name: Etapa 01 - Core

on:
  push:
    branches: [main]
    paths:
      - 'etapas/etapa-01-core-fundacao/**'
      - '.github/workflows/etapa-01-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates passwd
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/apt-get' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Debian como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-01-core-fundacao"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-01-core-fundacao' && ./scripts/check-posix.sh && ./scripts/build-install-debian.sh" > /tmp/nexxus-debian.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-debian.log
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/nexxus-debian.log | while IFS= read -r line; do
              printf '::error title=Nexxus Debian CI::%s\n' "$line"
            done
            exit "$status"
          fi
      - name: Exportar Cargo.lock resolvido
        uses: actions/upload-artifact@v4
        with:
          name: etapa-01-cargo-lock-debian-1.85
          path: etapas/etapa-01-core-fundacao/Cargo.lock
          if-no-files-found: error
      - name: Gerar cópia formatada para correção
        if: failure()
        shell: sh
        run: |
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-01-core-fundacao' && cargo fmt --all"
      - name: Exportar fontes formatados
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etapa-01-rustfmt-debian-1.85
          path: etapas/etapa-01-core-fundacao/crates
          if-no-files-found: error

  archlinux-current:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm sudo git ca-certificates
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Arch como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-01-core-fundacao"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-01-core-fundacao' && ./scripts/check-posix.sh && ./scripts/build-install-arch.sh" > /tmp/nexxus-arch.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-arch.log
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/nexxus-arch.log | while IFS= read -r line; do
              printf '::error title=Nexxus Arch CI::%s\n' "$line"
            done
            exit "$status"
          fi

  snapshot-entrega:
    needs: [debian-trixie, archlinux-current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gerar e validar snapshot da Etapa 01
        shell: sh
        run: |
          set -eu
          root='Nexxus_Etapa01_Core_0.1.0'
          out="$GITHUB_WORKSPACE/.delivery"
          stage="$out/$root"
          mkdir -p "$stage/etapas" "$stage/.github/workflows"
          cp -a etapas/etapa-01-core-fundacao "$stage/etapas/"
          cp .github/workflows/etapa-01-core.yml "$stage/.github/workflows/"
          cp LICENSE "$stage/"
          printf '%s\n' \
            "SNAPSHOT_SOURCE_COMMIT=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            'VERSION=0.1.0' \
            'STAGE=Etapa 01 - Core e Fundacao Arquitetural' \
            > "$stage/SNAPSHOT_BUILD_INFO.txt"
          tar -C "$out" -czf "$out/Nexxus_Etapa01_Core_0.1.0.tar.gz" "$root"
          tar -tzf "$out/Nexxus_Etapa01_Core_0.1.0.tar.gz" > "$out/contents.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$out/contents.txt"; then
            printf '%s\n' 'erro: caminho inseguro detectado no snapshot' >&2
            exit 1
          fi
          sha256sum "$out/Nexxus_Etapa01_Core_0.1.0.tar.gz" > "$out/Nexxus_Etapa01_Core_0.1.0.tar.gz.sha256"
          cat "$out/Nexxus_Etapa01_Core_0.1.0.tar.gz.sha256"
      - name: Exportar snapshot validado
        uses: actions/upload-artifact@v4
        with:
          name: Nexxus_Etapa01_Core_0.1.0
          path: |
            .delivery/Nexxus_Etapa01_Core_0.1.0.tar.gz
            .delivery/Nexxus_Etapa01_Core_0.1.0.tar.gz.sha256
            .delivery/contents.txt
          if-no-files-found: error
