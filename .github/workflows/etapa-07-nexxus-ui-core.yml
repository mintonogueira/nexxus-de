# CI real da Etapa 07 nos cenários Arch Linux e Debian.
name: Etapa 07 - Nexxus UI Core

on:
  push:
    branches: [main, etapa-07-nexxus-ui-core]
    paths:
      - 'etapas/etapa-07-nexxus-ui-core/**'
      - '.github/workflows/etapa-07-nexxus-ui-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'etapas/etapa-07-nexxus-ui-core/**'
      - '.github/workflows/etapa-07-nexxus-ui-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates passwd
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/apt-get' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Debian como usuário normal
        shell: sh
        run: |
          stage="$GITHUB_WORKSPACE/etapas/etapa-07-nexxus-ui-core"
          chown -R nexxus-builder:nexxus-builder "$stage"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$stage' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-debian.sh" > /tmp/nexxus-ui-debian.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-ui-debian.log
          if [ "$status" -ne 0 ]; then tail -n 220 /tmp/nexxus-ui-debian.log; exit "$status"; fi
      - name: Exportar lockfile e footprint validados no Debian
        uses: actions/upload-artifact@v4
        with:
          name: etapa-07-debian
          path: |
            etapas/etapa-07-nexxus-ui-core/Cargo.lock
            etapas/etapa-07-nexxus-ui-core/metrics/footprint.txt
          if-no-files-found: error

  archlinux-current:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm sudo git ca-certificates shadow
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Arch como usuário normal
        shell: sh
        run: |
          stage="$GITHUB_WORKSPACE/etapas/etapa-07-nexxus-ui-core"
          chown -R nexxus-builder:nexxus-builder "$stage"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$stage' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-arch.sh" > /tmp/nexxus-ui-arch.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-ui-arch.log
          if [ "$status" -ne 0 ]; then tail -n 220 /tmp/nexxus-ui-arch.log; exit "$status"; fi

  delivery:
    if: github.ref == 'refs/heads/etapa-07-nexxus-ui-core'
    needs: [debian-trixie, archlinux-current]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: etapa-07-nexxus-ui-core
      - name: Baixar resultados validados
        uses: actions/download-artifact@v5
        with:
          name: etapa-07-debian
          path: /tmp/etapa-07-debian
      - name: Consolidar lockfile, footprint e snapshot
        shell: sh
        run: |
          stage="$GITHUB_WORKSPACE/etapas/etapa-07-nexxus-ui-core"
          lock_file=$(find /tmp/etapa-07-debian -type f -name 'Cargo.lock' | head -n 1)
          footprint_file=$(find /tmp/etapa-07-debian -type f -name 'footprint.txt' | head -n 1)
          [ -f "$lock_file" ] || { echo 'Cargo.lock validado não encontrado' >&2; exit 1; }
          [ -f "$footprint_file" ] || { echo 'footprint validado não encontrado' >&2; exit 1; }
          cp "$lock_file" "$stage/Cargo.lock"
          mkdir -p "$stage/metrics"
          cp "$footprint_file" "$stage/metrics/footprint.txt"
          cd "$stage"
          sh ./scripts/check-posix.sh
          sh ./scripts/create-delivery.sh
      - name: Exportar snapshot da entrega
        uses: actions/upload-artifact@v4
        with:
          name: etapa-07-delivery
          path: |
            etapas/etapa-07-nexxus-ui-core/entrega/*.tar.gz
            etapas/etapa-07-nexxus-ui-core/entrega/*.sha256
          if-no-files-found: error
      - name: Versionar artefatos validados
        shell: sh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etapas/etapa-07-nexxus-ui-core/Cargo.lock \
                  etapas/etapa-07-nexxus-ui-core/metrics \
                  etapas/etapa-07-nexxus-ui-core/entrega
          if git diff --cached --quiet; then
            echo 'Artefatos já correspondem ao estado validado.'
            exit 0
          fi
          git commit -m 'build(etapa-07): publica lockfile footprint e snapshot validados [skip ci]'
          git push origin HEAD:etapa-07-nexxus-ui-core
