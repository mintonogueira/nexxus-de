# CI real da Etapa 05 nos cenários Arch Linux e Debian.
name: Etapa 05 - Workspace Manager

on:
  push:
    branches: [main, etapa-05-workspace-manager-impl]
    paths:
      - 'etapas/etapa-05-workspace-manager/**'
      - 'etapas/etapa-02-window-manager-core/crates/nexxus-wm/**'
      - 'etapas/etapa-01-core-fundacao/crates/nexxus-config/**'
      - '.github/workflows/etapa-05-workspace-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates passwd
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/apt-get' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Debian como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-05-workspace-manager"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-05-workspace-manager' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-debian.sh" > /tmp/nexxus-debian.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-debian.log
          if [ "$status" -ne 0 ]; then tail -n 160 /tmp/nexxus-debian.log; exit "$status"; fi
      - name: Exportar lockfile validado no Debian
        uses: actions/upload-artifact@v4
        with:
          name: etapa-05-debian
          path: etapas/etapa-05-workspace-manager/Cargo.lock
          if-no-files-found: error

  archlinux-current:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Preparar privilégio mínimo do builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm sudo git ca-certificates shadow
          useradd -m nexxus-builder
          printf '%s\n' 'nexxus-builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/nexxus-builder
          chmod 0440 /etc/sudoers.d/nexxus-builder
      - uses: actions/checkout@v5
      - name: Executar wrapper Arch como usuário normal
        shell: sh
        run: |
          chown -R nexxus-builder:nexxus-builder "$GITHUB_WORKSPACE/etapas/etapa-05-workspace-manager"
          set +e
          su -s /bin/sh nexxus-builder -c "cd '$GITHUB_WORKSPACE/etapas/etapa-05-workspace-manager' && sh ./scripts/check-posix.sh && sh ./scripts/build-install-arch.sh" > /tmp/nexxus-arch.log 2>&1
          status=$?
          set -e
          cat /tmp/nexxus-arch.log
          if [ "$status" -ne 0 ]; then tail -n 160 /tmp/nexxus-arch.log; exit "$status"; fi

  delivery:
    if: github.ref == 'refs/heads/etapa-05-workspace-manager-impl'
    needs: [debian-trixie, archlinux-current]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: etapa-05-workspace-manager-impl
      - name: Baixar lockfile validado
        uses: actions/download-artifact@v5
        with:
          name: etapa-05-debian
          path: /tmp/etapa-05-debian
      - name: Consolidar lockfile e gerar snapshot
        shell: sh
        run: |
          stage="$GITHUB_WORKSPACE/etapas/etapa-05-workspace-manager"
          lock_file=$(find /tmp/etapa-05-debian -type f -name 'Cargo.lock' | head -n 1)
          [ -f "$lock_file" ] || { echo 'Cargo.lock validado não encontrado' >&2; exit 1; }
          cp "$lock_file" "$stage/Cargo.lock"
          cd "$stage"
          sh ./scripts/check-posix.sh
          sh ./scripts/create-delivery.sh
      - name: Exportar snapshot da entrega
        uses: actions/upload-artifact@v4
        with:
          name: etapa-05-delivery
          path: |
            etapas/etapa-05-workspace-manager/entrega/*.tar.gz
            etapas/etapa-05-workspace-manager/entrega/*.sha256
          if-no-files-found: error
      - name: Versionar lockfile e snapshot validados
        shell: sh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etapas/etapa-05-workspace-manager/Cargo.lock \
                  etapas/etapa-05-workspace-manager/entrega
          if git diff --cached --quiet; then
            echo 'Artefatos já correspondem ao estado validado.'
            exit 0
          fi
          git commit -m 'build(etapa-05): publica lockfile e snapshot validados [skip ci]'
          git push origin HEAD:etapa-05-workspace-manager-impl
