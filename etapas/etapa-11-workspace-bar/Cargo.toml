[workspace]
members = ["crates/nexxus-workspace-bar"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
nexxus-workspaces = { path = "../etapa-05-workspace-manager/crates/nexxus-workspaces" }
nexxus-ui = { path = "../etapa-07-nexxus-ui-core/crates/nexxus-ui" }
nexxus-assets = { path = "../etapa-08-visual-assets/crates/nexxus-assets" }
thiserror = "2"
x11rb = { version = "0.14.0", default-features = false, features = ["randr"] }
