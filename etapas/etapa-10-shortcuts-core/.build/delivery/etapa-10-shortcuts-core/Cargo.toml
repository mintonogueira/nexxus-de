[workspace]
members = ["crates/nexxus-shortcuts"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/mintonogueira/nexxus-de"
publish = false

[workspace.dependencies]
nexxus-config = { path = "../etapa-01-core-fundacao/crates/nexxus-config" }
nexxus-tiling = { path = "../etapa-06-tiling-engine/crates/nexxus-tiling" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
x11rb = { version = "0.14.0", default-features = false }
