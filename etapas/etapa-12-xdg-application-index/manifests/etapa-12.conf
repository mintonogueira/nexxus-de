# Manifesto operacional da Etapa 12 — XDG Application Index.
NEXXUS_STAGE_ID='etapa-12-xdg-application-index'
NEXXUS_STAGE_NAME='XDG Application Index'
NEXXUS_VERSION='0.1.0'
# A Etapa 12 entrega biblioteca/serviço integrável. Desktop Shell, Finder e Menu
