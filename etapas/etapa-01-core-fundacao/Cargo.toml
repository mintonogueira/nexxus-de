[workspace]
resolver = "3"
members = [
    "crates/nexxus-core",
    "crates/nexxus-protocol",
    "crates/nexxus-config",
    "crates/nexxus-backend-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/mintonogueira/nexxus-de"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
