# Manifesto operacional confiável da Etapa 01.
# Este arquivo é carregado por scripts POSIX do próprio repositório; não deve
# receber conteúdo fornecido por fontes não confiáveis.
NEXXUS_STAGE_ID='etapa-01-core-fundacao'
NEXXUS_STAGE_NAME='Core e Fundação Arquitetural'
NEXXUS_VERSION='0.1.0'

# Esta etapa produz crates internos e contratos, mas ainda não produz um
# executável/runtime instalável. Os wrappers validam build/test/staging e não
# fabricam um pacote vazio apenas para aparentar conclusão do empacotamento.
NEXXUS_INSTALLABLE='0'

# Dependências de build são deliberadamente separadas por distribuição.
# Runtime permanece vazio porque não há payload instalado nesta etapa.
ARCH_BUILD_PACKAGES='base-devel rust'
ARCH_RUNTIME_PACKAGES=''
DEBIAN_BUILD_PACKAGES='build-essential cargo rustc rustfmt rust-clippy dpkg-dev'
DEBIAN_RUNTIME_PACKAGES=''
