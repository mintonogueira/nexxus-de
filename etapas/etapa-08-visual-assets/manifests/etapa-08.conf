# Manifesto operacional da Etapa 08 — Visual Assets.
NEXXUS_STAGE_ID='etapa-08-visual-assets'
NEXXUS_STAGE_NAME='Visual Assets'
NEXXUS_PACKAGE_NAME='nexxus-visual-assets'
NEXXUS_VERSION='0.1.0'
NEXXUS_INSTALLABLE='1'
NEXXUS_ASSET_ROOT='/usr/share/nexxus/assets'
NEXXUS_ICON_COUNT='82'
NEXXUS_WALLPAPER_COUNT='10'
# resvg e libxml2 são usados somente para validação estrutural/renderização dos SVGs.
# Hack é dependência de runtime e não é vendorizada no payload do Nexxus.
ARCH_BUILD_PACKAGES='base-devel rust libxml2 resvg fontconfig'
ARCH_RUNTIME_PACKAGES='ttf-hack'
DEBIAN_BUILD_PACKAGES='build-essential cargo rustc rustfmt rust-clippy libxml2-utils resvg fontconfig'
DEBIAN_RUNTIME_PACKAGES='fonts-hack'
