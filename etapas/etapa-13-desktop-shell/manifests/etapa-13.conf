# Manifesto operacional da Etapa 13 — Desktop Shell.
NEXXUS_STAGE_ID='etapa-13-desktop-shell'
NEXXUS_STAGE_NAME='Desktop Shell'
NEXXUS_VERSION='0.1.0'
# O Desktop Shell é um runtime integrável que será instanciado pelo Session
# Runtime; não é correto fabricar um pacote executável independente nesta etapa.
NEXXUS_INSTALLABLE='0'
ARCH_BUILD_PACKAGES='base-devel rust ttf-hack xorg-server-xvfb xorg-xauth'
ARCH_RUNTIME_PACKAGES=''
DEBIAN_BUILD_PACKAGES='build-essential cargo rustc rustfmt rust-clippy fonts-hack xvfb xauth'
DEBIAN_RUNTIME_PACKAGES=''
