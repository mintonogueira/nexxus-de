[workspace]
resolver = "3"
members = ["crates/nexxus-workspaces"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/mintonogueira/nexxus-de"
publish = false

[workspace.dependencies]
nexxus-config = { path = "../etapa-01-core-fundacao/crates/nexxus-config" }
nexxus-wm = { path = "../etapa-02-window-manager-core/crates/nexxus-wm" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
